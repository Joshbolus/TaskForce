<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TickBox</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs (compat version — works with plain script tags) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBhISTYliIrfDvVcLDq_fm9w62x_nRbnC4",
            authDomain: "tickbox-fe98f.firebaseapp.com",
            projectId: "tickbox-fe98f",
            storageBucket: "tickbox-fe98f.firebasestorage.app",
            messagingSenderId: "683114810754",
            appId: "1:683114810754:web:a974b071371dca95f0d39b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const tasksCollection = db.collection("tasks");
    </script>
</head>

<body>

    <div class="page-wrapper">

        <!-- Header -->
        <header class="site-header">
            <div class="header-inner">
                <div class="logo-group">
                    <img src="favicon.png" alt="TickBox logo" class="logo-img">
                    <h1>TickBox</h1>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" onclick="toggleTheme()">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero">
            <button id="startBtn" onclick="showForm()" class="btn-primary">
                <span>Start a list</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
        </section>

        <!-- Add Task Form -->
        <div id="taskForm" class="card form-card">
            <h2 class="form-title">New Task</h2>
            <div class="form-grid">
                <div class="field full">
                    <label for="taskInput">Task name</label>
                    <input type="text" id="taskInput" placeholder="What needs to be done?">
                </div>
                <div class="field full">
                    <label for="descriptionInput">Description</label>
                    <input type="text" id="descriptionInput" placeholder="Optional details…">
                </div>
                <div class="field">
                    <label for="dueDate">Due date</label>
                    <input type="date" id="dueDate">
                </div>
                <div class="field">
                    <label for="priority">Priority</label>
                    <select id="priority">
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button onclick="addTask()" class="btn-primary">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    Add task
                </button>
            </div>
        </div>

        <!-- Loading indicator -->
        <div id="loadingIndicator" class="loading-indicator">
            <div class="spinner"></div>
            <span>Loading your tasks…</span>
        </div>

        <!-- Progress -->
        <div id="progressSection" class="card progress-card">
            <div class="progress-header">
                <span class="progress-label">Progress</span>
                <span id="progressText" class="progress-pct">0%</span>
            </div>
            <div class="progress-track">
                <div id="progressFill" class="progress-fill" style="width: 0%"></div>
            </div>
            <p class="progress-sub" id="progressSub">No tasks yet</p>
        </div>

        <!-- Controls -->
        <div id="controls" class="controls-row">
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterTasks('all', this)">All</button>
                <button class="filter-btn" onclick="filterTasks('active', this)">Active</button>
                <button class="filter-btn" onclick="filterTasks('completed', this)">Done</button>
            </div>
            <div class="sort-group">
                <label for="sortTasks">Sort</label>
                <select id="sortTasks" onchange="sortTasks()">
                    <option value="default">Default</option>
                    <option value="priority">Priority</option>
                    <option value="dueDate">Due date</option>
                </select>
            </div>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <footer class="site-footer">
            <p>TickBox &mdash; Work in progress</p>
        </footer>

    </div>

    <script>

        // =========================================
        // FIREBASE HELPERS
        // =========================================

        async function saveTaskToFirebase(taskData) {
            const docRef = await tasksCollection.add({
                ...taskData,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            return docRef.id;
        }

        async function updateTaskInFirebase(docId, updates) {
            await tasksCollection.doc(docId).update(updates);
        }

        async function deleteTaskFromFirebase(docId) {
            await tasksCollection.doc(docId).delete();
        }

        async function loadTasksFromFirebase() {
            const snapshot = await tasksCollection.orderBy("createdAt", "asc").get();
            return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        }

        // =========================================
        // RENDER A TASK
        // =========================================
        function renderTask(taskData, docId) {
            const { name, description, dueDate, priority, completed } = taskData;
            const priorityClass = priority.toLowerCase();

            const li = document.createElement("li");
            li.classList.add("task-item");
            li.draggable = true;
            li.dataset.completed = completed ? "true" : "false";
            li.dataset.priority = priority;
            li.dataset.dueDate = dueDate || "9999-12-31";
            li.dataset.docId = docId;

            if (completed) li.classList.add("task-done");

            li.innerHTML = `
                <div class="task-left">
                    <label class="custom-checkbox">
                        <input type="checkbox" ${completed ? "checked" : ""}>
                        <span class="checkmark"></span>
                    </label>
                </div>
                <div class="task-body">
                    <div class="task-top-row">
                        <span class="task-name ${completed ? "completed" : ""}">${escapeHtml(name)}</span>
                        <span class="priority-badge priority-${priorityClass}">${priority}</span>
                    </div>
                    ${description ? `<p class="task-desc">${escapeHtml(description)}</p>` : ""}
                    <p class="task-date">${dueDate && dueDate !== "9999-12-31" ? "Due " + formatDate(dueDate) : "No due date"}</p>
                </div>
                <div class="task-actions">
                    <div class="dropdown">
                        <button class="icon-btn" title="More options">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <circle cx="8" cy="3" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="8" cy="13" r="1.2"/>
                            </svg>
                        </button>
                        <div class="dropdown-menu">
                            <a href="#" class="edit-option">Edit</a>
                            <a href="#" class="delete-option danger">Delete</a>
                        </div>
                    </div>
                </div>
            `;

            // Checkbox — toggle + save to Firebase
            const checkbox = li.querySelector("input[type='checkbox']");
            const taskName = li.querySelector(".task-name");

            checkbox.onchange = async function () {
                const isChecked = checkbox.checked;
                li.dataset.completed = isChecked ? "true" : "false";
                taskName.classList.toggle("completed", isChecked);
                li.classList.toggle("task-done", isChecked);
                updateProgressBar();
                await updateTaskInFirebase(li.dataset.docId, { completed: isChecked });
            };

            // Dropdown toggle
            const dropBtn = li.querySelector(".icon-btn");
            const dropMenu = li.querySelector(".dropdown-menu");

            dropBtn.onclick = function (e) {
                e.stopPropagation();
                closeAllDropdowns();
                dropMenu.classList.toggle("show");
            };

            // Edit — update UI + Firebase
            li.querySelector(".edit-option").onclick = async function (e) {
                e.preventDefault();
                const currentTask = taskName.textContent;
                const currentDesc = li.querySelector(".task-desc") ? li.querySelector(".task-desc").textContent : "";
                const currentDueDate = li.dataset.dueDate === "9999-12-31" ? "" : li.dataset.dueDate;
                const currentPriority = li.dataset.priority;

                const newTask = prompt("Edit task name:", currentTask);
                if (!newTask || !newTask.trim()) return;
                const newDesc = prompt("Edit description:", currentDesc);
                if (newDesc === null) return;
                const newDueDate = prompt("Edit due date (YYYY-MM-DD):", currentDueDate);
                if (newDueDate === null) return;
                const newPriority = prompt("Edit priority (Low, Medium, High):", currentPriority);
                if (newPriority === null) return;

                const cleaned = ["high", "medium", "low"].includes(newPriority.toLowerCase())
                    ? newPriority.charAt(0).toUpperCase() + newPriority.slice(1).toLowerCase()
                    : "Low";

                li.dataset.priority = cleaned;
                li.dataset.dueDate = newDueDate.trim() || "9999-12-31";
                taskName.textContent = newTask.trim();

                const badge = li.querySelector(".priority-badge");
                badge.textContent = cleaned;
                badge.className = "priority-badge priority-" + cleaned.toLowerCase();

                const dateEl = li.querySelector(".task-date");
                dateEl.textContent = newDueDate.trim() ? "Due " + formatDate(newDueDate.trim()) : "No due date";

                let descEl = li.querySelector(".task-desc");
                if (newDesc.trim()) {
                    if (!descEl) {
                        descEl = document.createElement("p");
                        descEl.classList.add("task-desc");
                        li.querySelector(".task-body").insertBefore(descEl, dateEl);
                    }
                    descEl.textContent = newDesc.trim();
                } else if (descEl) {
                    descEl.remove();
                }

                dropMenu.classList.remove("show");

                await updateTaskInFirebase(li.dataset.docId, {
                    name: newTask.trim(),
                    description: newDesc.trim(),
                    dueDate: newDueDate.trim() || "9999-12-31",
                    priority: cleaned
                });
            };

            // Delete — remove from UI + Firebase
            li.querySelector(".delete-option").onclick = async function (e) {
                e.preventDefault();
                const docId = li.dataset.docId;
                li.classList.add("removing");
                setTimeout(async () => {
                    li.remove();
                    updateProgressBar();
                    await deleteTaskFromFirebase(docId);
                }, 300);
            };

            enableDragAndDrop(li);
            return li;
        }

        // =========================================
        // ADD TASK
        // =========================================
        async function addTask() {
            const taskText = document.getElementById("taskInput").value.trim();
            const descriptionText = document.getElementById("descriptionInput").value.trim();
            const dueDate = document.getElementById("dueDate").value;
            const priority = document.getElementById("priority").value;

            if (taskText === "") {
                document.getElementById("taskInput").classList.add("shake");
                setTimeout(() => document.getElementById("taskInput").classList.remove("shake"), 400);
                return;
            }

            const taskData = {
                name: taskText,
                description: descriptionText,
                dueDate: dueDate || "9999-12-31",
                priority: priority,
                completed: false
            };

            // Save to Firestore first — we need the real doc ID
            const docId = await saveTaskToFirebase(taskData);

            const li = renderTask(taskData, docId);
            li.style.animation = "slideIn 0.3s ease forwards";
            document.getElementById("taskList").appendChild(li);

            document.getElementById("taskInput").value = "";
            document.getElementById("descriptionInput").value = "";
            document.getElementById("dueDate").value = "";
            document.getElementById("priority").value = "Low";
            document.getElementById("taskInput").focus();

            updateProgressBar();
        }

        // =========================================
        // LOAD TASKS ON PAGE LOAD
        // =========================================
        async function loadTasks() {
            const loading = document.getElementById("loadingIndicator");
            loading.style.display = "flex";

            try {
                const tasks = await loadTasksFromFirebase();

                if (tasks.length > 0) {
                    document.getElementById("taskForm").classList.add("visible");
                    document.getElementById("startBtn").style.display = "none";

                    tasks.forEach(task => {
                        const li = renderTask(task, task.id);
                        document.getElementById("taskList").appendChild(li);
                    });
                }

                updateProgressBar();
            } catch (err) {
                console.error("Error loading tasks:", err);
            } finally {
                loading.style.display = "none";
            }
        }

        // =========================================
        // SHOW FORM
        // =========================================
        function showForm() {
            document.getElementById("taskForm").classList.add("visible");
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("taskInput").focus();
        }

        // =========================================
        // UTILITIES
        // =========================================
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + "T00:00:00");
            return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
        }

        function closeAllDropdowns() {
            document.querySelectorAll(".dropdown-menu").forEach(m => m.classList.remove("show"));
        }

        document.addEventListener("click", function () { closeAllDropdowns(); });

        // =========================================
        // PROGRESS BAR
        // =========================================
        function updateProgressBar() {
            const tasks = document.querySelectorAll("#taskList .task-item");
            const done = document.querySelectorAll('#taskList .task-item[data-completed="true"]');
            const total = tasks.length;
            const completed = done.length;
            const pct = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById("progressFill").style.width = pct + "%";
            document.getElementById("progressText").textContent = pct + "%";
            document.getElementById("progressSub").textContent =
                total === 0 ? "No tasks yet" :
                completed === total ? "All done! Great work." :
                `${completed} of ${total} tasks complete`;
        }

        // =========================================
        // SORT
        // =========================================
        function sortTasks() {
            const list = document.getElementById("taskList");
            const tasks = Array.from(list.children);
            const sortType = document.getElementById("sortTasks").value;
            const prio = { High: 3, Medium: 2, Low: 1 };

            tasks.sort((a, b) => {
                if (sortType === "priority") return prio[b.dataset.priority] - prio[a.dataset.priority];
                if (sortType === "dueDate") return new Date(a.dataset.dueDate) - new Date(b.dataset.dueDate);
                return 0;
            });

            list.innerHTML = "";
            tasks.forEach(t => list.appendChild(t));
        }

        // =========================================
        // FILTER
        // =========================================
        function filterTasks(type, btn) {
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            if (btn) btn.classList.add("active");
            document.querySelectorAll("#taskList .task-item").forEach(task => {
                const done = task.dataset.completed === "true";
                task.style.display =
                    type === "active" && done ? "none" :
                    type === "completed" && !done ? "none" : "flex";
            });
        }

        // =========================================
        // DRAG AND DROP
        // =========================================
        function enableDragAndDrop(item) {
            item.addEventListener("dragstart", () => item.classList.add("dragging"));
            item.addEventListener("dragend", () => item.classList.remove("dragging"));
        }

        const list = document.getElementById("taskList");
        list.addEventListener("dragover", function (e) {
            e.preventDefault();
            const dragging = document.querySelector(".dragging");
            const after = getDragAfterElement(list, e.clientY);
            if (!dragging) return;
            after ? list.insertBefore(dragging, after) : list.appendChild(dragging);
        });

        function getDragAfterElement(container, y) {
            return [...container.querySelectorAll(".task-item:not(.dragging)")]
                .reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;
                    return offset < 0 && offset > closest.offset ? { offset, element: child } : closest;
                }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // =========================================
        // DARK MODE
        // =========================================
        function toggleTheme() {
            const isDark = document.body.classList.toggle("dark");
            localStorage.setItem("theme", isDark ? "dark" : "light");
        }

        (function () {
            if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark");
            }
        })();

        // =========================================
        // INIT
        // =========================================
        loadTasks();

    </script>

</body>
</html>
