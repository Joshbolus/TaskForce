<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TickBox</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Title and Logo -->
    <div class="title-container">
        <img src="favicon.png" alt="tickbox logo" class="title-icon">
        <h1>TickBox</h1>
    </div>
    <small>Work in Progress</small>
    <p>Personal To-Do Checklist</p>

    <!-- Start Button -->
    <div id="StartButton">
        <button onclick="showForm()">Start a List</button>
    </div>

    <!-- Task Form -->
    <div id="taskForm">
        <input type="text" id="taskInput" placeholder="Enter your task">

        <br><br>

        <label>Description:</label>
        <input type="text" id="descriptionInput" placeholder="Enter description">

        <br><br>

        <label>Due Date:</label>
        <input type="date" id="dueDate">

        <br><br>

        <label>Priority:</label>
        <select id="priority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select>

        <br><br>

        <button onclick="addTask()">+ Add Task</button>
    </div>

    <br>

    <!-- Progress Bar -->
    <div id="progressSection">
        <h3>Progress</h3>
        <progress id="progressBar" value="0" max="100"></progress>
        <p id="progressText">0% complete</p>
    </div>

    <!-- Controls -->
    <div id="controls">
        <label for="sortTasks">Sort By:</label>
        <select id="sortTasks" onchange="sortTasks()">
            <option value="default">Default</option>
            <option value="priority">Priority</option>
            <option value="dueDate">Due Date</option>
        </select>

        <br><br>

        <button onclick="filterTasks('all')">All Tasks</button>
        <button onclick="filterTasks('active')">Active Tasks</button>
        <button onclick="filterTasks('completed')">Completed Tasks</button>
    </div>

    <!-- Task List -->
    <h3>Task List</h3>
    <ul id="taskList"></ul>

    <script>
        // =========================================
        // 1. START BUTTON / FORM DISPLAY
        // =========================================
        function showForm() {
            document.getElementById("taskForm").style.display = "block";
            document.getElementById("StartButton").style.display = "none";
        }

        // =========================================
        // 2. ADD TASK
        // =========================================
        function addTask() {
            const taskText = document.getElementById("taskInput").value.trim();
            const descriptionText = document.getElementById("descriptionInput").value.trim();
            const dueDate = document.getElementById("dueDate").value;
            const priority = document.getElementById("priority").value;

            if (taskText === "") {
                alert("Please enter a task.");
                return;
            }

            const li = document.createElement("li");
            li.draggable = true;
            li.dataset.completed = "false";
            li.dataset.priority = priority;
            li.dataset.dueDate = dueDate || "9999-12-31";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";

            const taskContainer = document.createElement("div");
            taskContainer.classList.add("task-container");

            const text = document.createElement("span");
            text.textContent = taskText + " - " + priority + " Priority";
            text.classList.add("taskItem");

            const description = document.createElement("div");
            description.textContent = descriptionText;
            description.classList.add("taskDescription");

            const date = document.createElement("div");
            date.textContent = dueDate ? "Due: " + dueDate : "Due: No date set";
            date.classList.add("taskDate");

            checkbox.onclick = function () {
                if (checkbox.checked) {
                    text.classList.add("completed");
                    li.dataset.completed = "true";
                } else {
                    text.classList.remove("completed");
                    li.dataset.completed = "false";
                }
                updateProgressBar();
            };

            // Dropdown
            const dropdown = document.createElement("div");
            dropdown.classList.add("dropdown");

            const dropBtn = document.createElement("button");
            dropBtn.textContent = "⋮";
            dropBtn.classList.add("icon-button");

            const dropdownContent = document.createElement("div");
            dropdownContent.classList.add("dropdown-content");

            // Edit button
            const editOption = document.createElement("a");
            editOption.href = "#";
            editOption.textContent = "Edit";
            editOption.onclick = function (e) {
                e.preventDefault();

                const currentTask = text.textContent.replace(" - " + li.dataset.priority + " Priority", "");
                const currentDescription = description.textContent;
                const currentDueDate = li.dataset.dueDate === "9999-12-31" ? "" : li.dataset.dueDate;
                const currentPriority = li.dataset.priority;

                const newTask = prompt("Edit task name:", currentTask);
                if (newTask === null || newTask.trim() === "") return;

                const newDescription = prompt("Edit description:", currentDescription);
                if (newDescription === null) return;

                const newDueDate = prompt("Edit due date (YYYY-MM-DD):", currentDueDate);
                if (newDueDate === null) return;

                const newPriority = prompt("Edit priority (Low, Medium, High):", currentPriority);
                if (newPriority === null) return;

                const cleanedPriority =
                    newPriority.toLowerCase() === "high" ? "High" :
                    newPriority.toLowerCase() === "medium" ? "Medium" :
                    "Low";

                li.dataset.priority = cleanedPriority;
                li.dataset.dueDate = newDueDate.trim() === "" ? "9999-12-31" : newDueDate.trim();

                text.textContent = newTask.trim() + " - " + cleanedPriority + " Priority";
                description.textContent = newDescription.trim();
                date.textContent = newDueDate.trim() === "" ? "Due: No date set" : "Due: " + newDueDate.trim();
            };

            // Delete button
            const deleteOption = document.createElement("a");
            deleteOption.href = "#";
            deleteOption.textContent = "Delete";
            deleteOption.onclick = function (e) {
                e.preventDefault();
                li.remove();
                updateProgressBar();
            };

            dropdownContent.appendChild(editOption);
            dropdownContent.appendChild(deleteOption);

            dropBtn.onclick = function (e) {
                e.stopPropagation();
                closeAllDropdowns();
                dropdownContent.classList.toggle("show");
            };

            dropdown.appendChild(dropBtn);
            dropdown.appendChild(dropdownContent);

            taskContainer.appendChild(text);
            taskContainer.appendChild(description);
            taskContainer.appendChild(date);

            li.appendChild(checkbox);
            li.appendChild(taskContainer);
            li.appendChild(dropdown);

            document.getElementById("taskList").appendChild(li);

            // Clear inputs
            document.getElementById("taskInput").value = "";
            document.getElementById("descriptionInput").value = "";
            document.getElementById("dueDate").value = "";
            document.getElementById("priority").value = "Low";

            enableDragAndDrop(li);
            updateProgressBar();
        }

        // =========================================
        // 3. EDIT / DELETE DROPDOWN HELPERS
        // =========================================
        function closeAllDropdowns() {
            const dropdowns = document.querySelectorAll(".dropdown-content");
            dropdowns.forEach(menu => menu.classList.remove("show"));
        }

        document.addEventListener("click", function (event) {
            const dropdowns = document.querySelectorAll(".dropdown-content");
            dropdowns.forEach(function (menu) {
                if (!menu.parentElement.contains(event.target)) {
                    menu.classList.remove("show");
                }
            });
        });

        // =========================================
        // 4. PROGRESS BAR
        // =========================================
        function updateProgressBar() {
            const tasks = document.querySelectorAll("#taskList li");
            const completedTasks = document.querySelectorAll('#taskList li[data-completed="true"]');

            const total = tasks.length;
            const completed = completedTasks.length;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById("progressBar").value = percent;
            document.getElementById("progressText").textContent = percent + "% complete";
        }

        // =========================================
        // 5. SORT TASKS
        // =========================================
        function sortTasks() {
            const list = document.getElementById("taskList");
            const tasks = Array.from(list.children);
            const sortType = document.getElementById("sortTasks").value;

            const priorityOrder = {
                "High": 3,
                "Medium": 2,
                "Low": 1
            };

            tasks.sort(function (a, b) {
                if (sortType === "priority") {
                    return priorityOrder[b.dataset.priority] - priorityOrder[a.dataset.priority];
                }

                if (sortType === "dueDate") {
                    return new Date(a.dataset.dueDate) - new Date(b.dataset.dueDate);
                }

                return 0;
            });

            list.innerHTML = "";
            tasks.forEach(task => list.appendChild(task));
        }

        // =========================================
        // 6. FILTER TASKS
        // =========================================
        function filterTasks(filterType) {
            const tasks = document.querySelectorAll("#taskList li");

            tasks.forEach(task => {
                const isCompleted = task.dataset.completed === "true";

                if (filterType === "all") {
                    task.style.display = "flex";
                } else if (filterType === "active") {
                    task.style.display = isCompleted ? "none" : "flex";
                } else if (filterType === "completed") {
                    task.style.display = isCompleted ? "flex" : "none";
                }
            });
        }

        // =========================================
        // 7. DRAG AND DROP
        // =========================================
        function enableDragAndDrop(item) {
            item.addEventListener("dragstart", function () {
                item.classList.add("dragging");
            });

            item.addEventListener("dragend", function () {
                item.classList.remove("dragging");
            });
        }

        const list = document.getElementById("taskList");

        list.addEventListener("dragover", function (e) {
            e.preventDefault();
            const draggingItem = document.querySelector(".dragging");
            const afterElement = getDragAfterElement(list, e.clientY);

            if (!draggingItem) return;

            if (afterElement == null) {
                list.appendChild(draggingItem);
            } else {
                list.insertBefore(draggingItem, afterElement);
            }
        });

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll("li:not(.dragging)")];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;

                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }
    </script>

</body>
</html>
