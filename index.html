<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TickBox</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-wrapper">

        <!-- Header -->
        <header class="site-header">
            <div class="header-inner">
                <div class="logo-group">
                    <img src="favicon.png" alt="TickBox logo" class="logo-img">
                    <h1>TickBox</h1>
                </div>
            </div>
        </header>

        <!-- Hero -->
        <section class="hero">
            <button id="startBtn" onclick="showForm()" class="btn-primary">
                <span>Start a list</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
        </section>

        <!-- Add Task Form -->
        <div id="taskForm" class="card form-card">
            <h2 class="form-title">New Task</h2>
            <div class="form-grid">
                <div class="field full">
                    <label for="taskInput">Task name</label>
                    <input type="text" id="taskInput" placeholder="What needs to be done?">
                </div>
                <div class="field full">
                    <label for="descriptionInput">Description</label>
                    <input type="text" id="descriptionInput" placeholder="Optional details…">
                </div>
                <div class="field">
                    <label for="dueDate">Due date</label>
                    <input type="date" id="dueDate">
                </div>
                <div class="field">
                    <label for="priority">Priority</label>
                    <select id="priority">
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button onclick="addTask()" class="btn-primary">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    Add task
                </button>
            </div>
        </div>

        <!-- Progress -->
        <div id="progressSection" class="card progress-card">
            <div class="progress-header">
                <span class="progress-label">Progress</span>
                <span id="progressText" class="progress-pct">0%</span>
            </div>
            <div class="progress-track">
                <div id="progressFill" class="progress-fill" style="width: 0%"></div>
            </div>
            <p class="progress-sub" id="progressSub">No tasks yet</p>
        </div>

        <!-- Controls -->
        <div id="controls" class="controls-row">
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterTasks('all', this)">All</button>
                <button class="filter-btn" onclick="filterTasks('active', this)">Active</button>
                <button class="filter-btn" onclick="filterTasks('completed', this)">Done</button>
            </div>
            <div class="sort-group">
                <label for="sortTasks">Sort</label>
                <select id="sortTasks" onchange="sortTasks()">
                    <option value="default">Default</option>
                    <option value="priority">Priority</option>
                    <option value="dueDate">Due date</option>
                </select>
            </div>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <footer class="site-footer">
            <p>TickBox &mdash; Work in progress</p>
        </footer>

    </div>

    <script>
        function showForm() {
            document.getElementById("taskForm").classList.add("visible");
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("taskInput").focus();
        }

        function addTask() {
            const taskText = document.getElementById("taskInput").value.trim();
            const descriptionText = document.getElementById("descriptionInput").value.trim();
            const dueDate = document.getElementById("dueDate").value;
            const priority = document.getElementById("priority").value;

            if (taskText === "") {
                document.getElementById("taskInput").classList.add("shake");
                setTimeout(() => document.getElementById("taskInput").classList.remove("shake"), 400);
                return;
            }

            const li = document.createElement("li");
            li.classList.add("task-item");
            li.draggable = true;
            li.dataset.completed = "false";
            li.dataset.priority = priority;
            li.dataset.dueDate = dueDate || "9999-12-31";

            const priorityClass = priority.toLowerCase();

            li.innerHTML = `
                <div class="task-left">
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                    </label>
                </div>
                <div class="task-body">
                    <div class="task-top-row">
                        <span class="task-name">${escapeHtml(taskText)}</span>
                        <span class="priority-badge priority-${priorityClass}">${priority}</span>
                    </div>
                    ${descriptionText ? `<p class="task-desc">${escapeHtml(descriptionText)}</p>` : ""}
                    <p class="task-date">${dueDate ? "Due " + formatDate(dueDate) : "No due date"}</p>
                </div>
                <div class="task-actions">
                    <div class="dropdown">
                        <button class="icon-btn" title="More options">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <circle cx="8" cy="3" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="8" cy="13" r="1.2"/>
                            </svg>
                        </button>
                        <div class="dropdown-menu">
                            <a href="#" class="edit-option">Edit</a>
                            <a href="#" class="delete-option danger">Delete</a>
                        </div>
                    </div>
                </div>
            `;

            const checkbox = li.querySelector("input[type='checkbox']");
            const taskName = li.querySelector(".task-name");

            checkbox.onchange = function () {
                li.dataset.completed = checkbox.checked ? "true" : "false";
                taskName.classList.toggle("completed", checkbox.checked);
                li.classList.toggle("task-done", checkbox.checked);
                updateProgressBar();
            };

            const dropBtn = li.querySelector(".icon-btn");
            const dropMenu = li.querySelector(".dropdown-menu");

            dropBtn.onclick = function (e) {
                e.stopPropagation();
                closeAllDropdowns();
                dropMenu.classList.toggle("show");
            };

            li.querySelector(".edit-option").onclick = function (e) {
                e.preventDefault();
                const currentTask = taskName.textContent;
                const currentDesc = li.querySelector(".task-desc") ? li.querySelector(".task-desc").textContent : "";
                const currentDueDate = li.dataset.dueDate === "9999-12-31" ? "" : li.dataset.dueDate;
                const currentPriority = li.dataset.priority;

                const newTask = prompt("Edit task name:", currentTask);
                if (!newTask || !newTask.trim()) return;
                const newDesc = prompt("Edit description:", currentDesc);
                if (newDesc === null) return;
                const newDueDate = prompt("Edit due date (YYYY-MM-DD):", currentDueDate);
                if (newDueDate === null) return;
                const newPriority = prompt("Edit priority (Low, Medium, High):", currentPriority);
                if (newPriority === null) return;

                const cleaned = ["high","medium","low"].includes(newPriority.toLowerCase())
                    ? newPriority.charAt(0).toUpperCase() + newPriority.slice(1).toLowerCase()
                    : "Low";

                li.dataset.priority = cleaned;
                li.dataset.dueDate = newDueDate.trim() || "9999-12-31";
                taskName.textContent = newTask.trim();

                const badge = li.querySelector(".priority-badge");
                badge.textContent = cleaned;
                badge.className = "priority-badge priority-" + cleaned.toLowerCase();

                const dateEl = li.querySelector(".task-date");
                dateEl.textContent = newDueDate.trim() ? "Due " + formatDate(newDueDate.trim()) : "No due date";

                let descEl = li.querySelector(".task-desc");
                if (newDesc.trim()) {
                    if (!descEl) {
                        descEl = document.createElement("p");
                        descEl.classList.add("task-desc");
                        li.querySelector(".task-body").insertBefore(descEl, dateEl);
                    }
                    descEl.textContent = newDesc.trim();
                } else if (descEl) {
                    descEl.remove();
                }

                dropMenu.classList.remove("show");
            };

            li.querySelector(".delete-option").onclick = function (e) {
                e.preventDefault();
                li.classList.add("removing");
                setTimeout(() => { li.remove(); updateProgressBar(); }, 300);
            };

            enableDragAndDrop(li);
            document.getElementById("taskList").appendChild(li);

            li.style.animation = "slideIn 0.3s ease forwards";

            document.getElementById("taskInput").value = "";
            document.getElementById("descriptionInput").value = "";
            document.getElementById("dueDate").value = "";
            document.getElementById("priority").value = "Low";

            updateProgressBar();
        }

        function escapeHtml(str) {
            return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + "T00:00:00");
            return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
        }

        function closeAllDropdowns() {
            document.querySelectorAll(".dropdown-menu").forEach(m => m.classList.remove("show"));
        }

        document.addEventListener("click", function () { closeAllDropdowns(); });

        function updateProgressBar() {
            const tasks = document.querySelectorAll("#taskList .task-item");
            const done = document.querySelectorAll('#taskList .task-item[data-completed="true"]');
            const total = tasks.length;
            const completed = done.length;
            const pct = total === 0 ? 0 : Math.round((completed / total) * 100);

            document.getElementById("progressFill").style.width = pct + "%";
            document.getElementById("progressText").textContent = pct + "%";
            document.getElementById("progressSub").textContent =
                total === 0 ? "No tasks yet" :
                completed === total ? "All done! Great work." :
                `${completed} of ${total} tasks complete`;
        }

        function sortTasks() {
            const list = document.getElementById("taskList");
            const tasks = Array.from(list.children);
            const sortType = document.getElementById("sortTasks").value;
            const prio = { High: 3, Medium: 2, Low: 1 };

            tasks.sort((a, b) => {
                if (sortType === "priority") return prio[b.dataset.priority] - prio[a.dataset.priority];
                if (sortType === "dueDate") return new Date(a.dataset.dueDate) - new Date(b.dataset.dueDate);
                return 0;
            });

            list.innerHTML = "";
            tasks.forEach(t => list.appendChild(t));
        }

        function filterTasks(type, btn) {
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            if (btn) btn.classList.add("active");
            document.querySelectorAll("#taskList .task-item").forEach(task => {
                const done = task.dataset.completed === "true";
                task.style.display =
                    type === "active" && done ? "none" :
                    type === "completed" && !done ? "none" : "flex";
            });
        }

        function enableDragAndDrop(item) {
            item.addEventListener("dragstart", () => item.classList.add("dragging"));
            item.addEventListener("dragend", () => item.classList.remove("dragging"));
        }

        const list = document.getElementById("taskList");
        list.addEventListener("dragover", function (e) {
            e.preventDefault();
            const dragging = document.querySelector(".dragging");
            const after = getDragAfterElement(list, e.clientY);
            if (!dragging) return;
            after ? list.insertBefore(dragging, after) : list.appendChild(dragging);
        });

        function getDragAfterElement(container, y) {
            return [...container.querySelectorAll(".task-item:not(.dragging)")]
                .reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;
                    return offset < 0 && offset > closest.offset ? { offset, element: child } : closest;
                }, { offset: Number.NEGATIVE_INFINITY }).element;
        }
    </script>

</body>
</html>
