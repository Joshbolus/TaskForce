<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TickBox</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <style>
        #taskForm {
            display: none;
            margin-top: 15px;
        }

        .completed {
            text-decoration: line-through;
            opacity: 0.6;
        }

        li {
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <!-- Title and Logo -->
    <div class="title-container">
        <img src="favicon.png" alt="tickbox logo" class="title-icon">
        <h1>TickBox</h1>
    </div>
    <small>Work in Progress</small>
    <p>Personal To-Do Checklist</p>

    <!-- Start Button -->
    <div id="StartButton">
        <button onclick="showForm()">Start a List</button>
    </div>

    <!-- Task Form -->
    <div id="taskForm">

        <input type="text" id="taskInput" placeholder="Enter your task">

        <br><br>

        <label>Priority:</label>
        <select id="priority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select>

        <br><br>

        <button onclick="addTask()">+ Add Task</button>
    </div>

    <!-- Task List -->
    <h3>Task List</h3>
    <ul id="taskList"></ul>

    <script>

        // Show form and hide start button
        function showForm() {
            document.getElementById("taskForm").style.display = "block";
            document.getElementById("StartButton").style.display = "none";
        }

        // Add task to list
        function addTask() {
            var taskText = document.getElementById("taskInput").value;
            var priority = document.getElementById("priority").value;

            if (taskText === "") {
                alert("Please enter a task.");
                return;
            }

            var li = document.createElement("li");
            li.draggable = true;

            var checkbox = document.createElement("input");
            checkbox.type = "checkbox";

            var text = document.createElement("span");
            text.textContent = taskText + " - " + priority + " Priority";
            text.classList.add("taskItem");

            // Creates a drag handle
            var handle = document.createElement("span");
            handle.textContent = "☰";
            text.classList.add("dragHandle")

            // Toggle completed style
            checkbox.onclick = function () {
                if (checkbox.checked) {
                    text.classList.add("completed");
                } else {
                    text.classList.remove("completed");
                }
            };

            li.appendChild(checkbox);
            li.appendChild(text);
            li.appendChild(handle);

            document.getElementById("taskList").appendChild(li);

            document.getElementById("taskInput").value = "";

            enableDragAndDrop(li);
        }

        // Function for dragging task items around within the list
        function enableDragAndDrop(item) {
            item.addEventListener("dragstart", function (e) {
                item.classList.add("dragging");  
            });

            item.addEventListener("dragend", function () {
                item.classList.remove("dragging");
            });

            var list = document.getElementById("taskList");
            list.addEventListener("dragover", function (e) {
                e.preventDefault();
                var draggingItem = document.querySelector(".dragging");
                var afterElement = getDragAfterElement(list, e.clientY);
                if (afterElement == null) {
                    list.appendChild(draggingItem);
                } else {
                    list.insertBefore(draggingItem, afterElement);
                }   
            });
        }

        // Function for inserting dragged item in the list based on users mouse
        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll("li:not(.dragging)")];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

    </script>

</body>
</html>
